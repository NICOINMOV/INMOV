<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="INMOV">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>INMOV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#FF5118;--k:#000;--t:#1A1A1A;--g:#6B6B6B;--l:#F2F2F2;--b:#E6E6E6;
--ok:#1B6B3A;--okb:#DDF3E4;--w:#8A3B00;--wb:#FFE8D9;--r:#A11D1D;--rb:#FBDADA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff}
body{font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--t);
padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
header{background:var(--k);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}
.logo img{height:30px;display:block}
.ref{background:none;border:0;color:#9a9a9a;font-size:22px;padding:4px 6px}
.dia{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px}
.dia h1{margin:0;font-size:30px;line-height:1.05;font-weight:700}
.dia h1 small{display:block;font-size:13px;font-weight:500;color:var(--o);margin-bottom:4px}
.flechas{display:flex;gap:6px}
.flechas button{width:42px;height:42px;border-radius:12px;border:0;background:#1F1F1F;color:#fff;font-size:20px}
.res{margin-top:12px;font-size:13px;color:#B5B5B5}
main{padding:6px 18px 10px}
.cli{padding:16px 0;border-bottom:1px solid var(--b)}
.cli:last-child{border-bottom:0}
.nm{font-weight:600;font-size:17px}
.sub{color:var(--g);font-size:13px;margin-top:2px}
.sub .q{color:var(--t);font-weight:600}
.sub .q.poco{color:var(--o)}
.acc{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:12px}
.acc button{border:0;border-radius:14px;padding:14px 4px;font-size:15px;font-weight:600}
.vino{background:var(--o);color:#fff}.avi{background:var(--l);color:var(--t)}.fal{background:var(--l);color:var(--r)}
.hecho{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:11px 14px;border-radius:14px;background:var(--okb);color:var(--ok);font-weight:600;font-size:15px}
.hecho.mov{background:var(--l);color:var(--t)}
.lnk{display:block;margin:10px auto 0;background:none;border:0;color:var(--g);font-size:13px;font-weight:500;text-decoration:underline;padding:4px 8px}
.hecho.no{background:var(--wb);color:var(--w)}
.hecho button{background:none;border:0;color:inherit;text-decoration:underline;font-size:14px;font-weight:500}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;margin:8px 6px 0 0}
.t-ok{background:var(--okb);color:var(--ok)}.t-w{background:var(--wb);color:var(--w)}.t-r{background:var(--rb);color:var(--r)}
.pg{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;text-align:left;padding:16px 0;border-bottom:1px solid var(--b);color:inherit}
.pg .mas{color:var(--o);font-size:24px;font-weight:500}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--g);font-weight:500;position:relative}
nav button.on{color:var(--k);font-weight:600}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--o)}
nav .ic{display:block;font-size:20px;line-height:26px}
.badge{display:inline-block;background:var(--o);color:#fff;border-radius:999px;min-width:18px;padding:0 5px;font-size:11px;line-height:18px;margin-left:4px}
.capa{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
.capa.on{display:flex}
.panel{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel h3{margin:0 0 2px;font-size:19px}.panel p{margin:0 0 14px;color:var(--g);font-size:14px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 14px}
.rpe button,.opt{border:1px solid var(--b);background:#fff;border-radius:12px;padding:12px 0;font-size:16px;font-weight:600;color:var(--t)}
.rpe button.on,.opt.on{background:var(--k);border-color:var(--k);color:#fff}
.big{width:100%;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:600;background:var(--o);color:#fff;margin-top:8px}
.sec{width:100%;border:0;border-radius:16px;padding:15px;font-size:15px;font-weight:500;background:var(--l);color:var(--t);margin-top:8px}
label{display:block;font-size:13px;color:var(--g);margin:12px 0 5px;font-weight:500}
input,select{width:100%;font-family:inherit;font-size:16px;padding:12px;border:1px solid var(--b);border-radius:12px;background:#fff;color:var(--t)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.opts .opt{font-size:14px}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--o)}
.vacio{text-align:center;color:var(--g);padding:48px 16px}
.vacio strong{display:block;font-size:20px;color:var(--t);margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--k);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;display:none;z-index:20;white-space:nowrap}
.carga{color:var(--g);padding:32px 0;text-align:center}
a.lnk{color:var(--o);font-weight:600;font-size:14px;text-decoration:none}
.conf{padding:calc(40px + env(safe-area-inset-top)) 24px 40px;background:var(--k);min-height:100vh;color:#fff}
.conf img{height:52px;margin:0 0 18px;display:block}
.conf p{color:#B5B5B5;font-size:15px;line-height:1.5}
.conf label{color:#B5B5B5}.conf input{background:#151515;border-color:#2A2A2A;color:#fff}
.conf .err{color:#FF8A65;font-size:14px;min-height:20px;margin-top:10px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--l);padding:4px;border-radius:14px;margin:6px 0 4px}
.seg button{border:0;background:none;border-radius:11px;padding:11px 0;font-size:15px;font-weight:600;color:var(--g)}
.seg button.on{background:#fff;color:var(--k);box-shadow:0 1px 3px rgba(0,0,0,.12)}
details.sec2{border-top:1px solid var(--b);padding:4px 0}
details.sec2 summary{list-style:none;padding:14px 0;font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.sec2 summary::-webkit-details-marker{display:none}
details.sec2 summary::after{content:"+";color:var(--o);font-size:22px;font-weight:500}
details.sec2[open] summary::after{content:"–"}
details.sec2 .cnt{padding:0 0 14px}
textarea{width:100%;font-family:inherit;font-size:16px;padding:12px;border:1px solid var(--b);border-radius:12px;min-height:64px;resize:vertical;color:var(--t)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{font-size:13px;color:var(--g);margin-top:6px}
.calc b{color:var(--t)}
.ok-box{background:var(--okb);color:var(--ok);border-radius:16px;padding:18px;margin-top:10px}
.ok-box a{color:var(--ok);font-weight:600}
.nota{font-size:13px;color:var(--g);margin:10px 0 0}

.grp{margin:18px 0 2px;font-size:12px;font-weight:600;color:var(--g);text-transform:uppercase;letter-spacing:.6px}
.hora{display:inline-block;background:var(--k);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;margin-right:8px;vertical-align:2px}
.nmb{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.nmb .nm::after{content:" ›";color:var(--g);font-weight:400}
.libre{background:var(--wb);color:var(--w);border-radius:16px;padding:16px;margin:12px 0;font-weight:600}
.libre button{background:none;border:0;color:var(--w);text-decoration:underline;font-size:14px;padding:0;margin-top:6px;display:block}
.mas-dia{background:#1F1F1F;color:#fff;border:0;border-radius:12px;width:42px;height:42px;font-size:20px;font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button{border:0;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;background:var(--l);color:var(--t)}
.acts button.pri{background:var(--o);color:#fff}
.dato{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--b);font-size:15px}
.dato span:first-child{color:var(--g)}
.dato span:last-child{font-weight:600;text-align:right}
.cand{display:block;width:100%;text-align:left;border:1px solid var(--b);background:#fff;border-radius:12px;padding:12px;margin-top:8px;font-size:15px;color:var(--t)}
.cand.on{border-color:var(--o);box-shadow:0 0 0 2px var(--o) inset}
.cand small{display:block;color:var(--g);font-size:12px}

</style>
</head>
<body>
<div id="app"></div>
<div class="capa" id="capa" onclick="if(event.target===this)cerrar()"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script>
var CFG={u:localStorage.getItem('inmov_u')||'',k:localStorage.getItem('inmov_k')||''};
var D=null,vista='hoy',fecha=new Date(),rpe=null,parcial=false,met='Transferencia';
var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function $(id){return document.getElementById(id)}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t,ms){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window._t);window._t=setTimeout(function(){e.style.display='none'},ms||2200)}
function api(body){body.k=CFG.k;return fetch(CFG.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
  .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error);return j.data})}

/* ---------- Configuración inicial ---------- */
function pantallaConf(msg){
  $('app').innerHTML='<div class="conf"><img src="logo-blanco.png" alt="INMOV"><p>Conecta la app con tu planilla. Esto se hace una sola vez.</p>'+
  '<label for="cu">Enlace de la app web (termina en /exec)</label><input id="cu" autocapitalize="off" autocorrect="off" value="'+esc(CFG.u)+'">'+
  '<label for="ck">Clave</label><input id="ck" autocapitalize="off" autocorrect="off" value="'+esc(CFG.k)+'">'+
  '<div class="err" id="cerr">'+esc(msg||'')+'</div><button class="big" onclick="conectar()">Conectar</button></div>';
}
function conectar(){
  CFG.u=$('cu').value.trim();CFG.k=$('ck').value.trim();
  if(CFG.u.indexOf('https://script.google.com/')!==0||CFG.u.slice(-5)!=='/exec'){$('cerr').textContent='El enlace debe empezar con https://script.google.com/ y terminar en /exec';return}
  $('cerr').textContent='Conectando…';
  api({a:'ping'}).then(function(){localStorage.setItem('inmov_u',CFG.u);localStorage.setItem('inmov_k',CFG.k);iniciar()})
  .catch(function(e){$('cerr').textContent=/Clave/.test(e.message)?'La clave no coincide. Cópiala de nuevo desde el registro de Apps Script.':'No se pudo conectar. Revisa el enlace y que la implementación tenga acceso "Cualquier persona".'})
}

/* ---------- App ---------- */
function iniciar(){
  $('app').innerHTML='<header><div class="top"><div class="logo"><img src="logo-blanco.png" alt="INMOV"></div><button class="ref" aria-label="Actualizar" onclick="cargar()">↻</button></div>'+
  '<div class="dia" id="dia"><h1 id="titulo"></h1><div class="flechas"><button class="mas-dia" aria-label="Opciones del día" onclick="menuDia()">⋯</button><button aria-label="Día anterior" onclick="mover(-1)">‹</button><button aria-label="Día siguiente" onclick="mover(1)">›</button></div></div>'+
  '<div class="res" id="res"></div></header><main id="main"><div class="carga">Cargando…</div></main>'+
  '<nav><button id="n-hoy" class="on" onclick="ver(\'hoy\')"><span class="ic">✓</span>Sesiones</button>'+
  '<button id="n-pag" onclick="ver(\'pag\')"><span class="ic">$</span>Pagos</button>'+
  '<button id="n-ale" onclick="ver(\'ale\')"><span class="ic">!</span>Alertas<span id="nb"></span></button>'+
  '<button id="n-nue" onclick="ver(\'nue\')"><span class="ic">+</span>Nuevo</button></nav>';
  pintaTitulo();cargar();
}
function pintaTitulo(){
  var t=$('titulo');if(!t)return;
  if(vista==='hoy'){var h=iso(new Date())===iso(fecha);
    t.innerHTML='<small>'+(h?'Hoy':(iso(new Date(Date.now()-864e5))===iso(fecha)?'Ayer':fecha.getDate()+' de '+MESES[fecha.getMonth()]))+'</small>'+DIAS[fecha.getDay()]+' '+fecha.getDate();
    document.querySelector('.flechas').style.display='flex'}
  else{var T={pag:['Registrar','Pagos'],ale:['Lo que necesita atención','Alertas'],nue:['Anamnesis','Nuevo cliente']}[vista];t.innerHTML='<small>'+T[0]+'</small>'+T[1];document.querySelector('.flechas').style.display='none'}
}
function mover(n){fecha.setDate(fecha.getDate()+n);pintaTitulo();$('main').innerHTML='<div class="carga">Cargando…</div>';cargar()}
var nCarga=0;
function cargar(){
  var n=++nCarga; /* si cambias de día rápido, solo vale la última respuesta */
  api({a:'datos',fecha:iso(fecha)}).then(function(d){if(n!==nCarga)return;D=d;pintar()}).catch(function(e){
    if(n!==nCarga)return;
    if(/Clave/.test(e.message)){pantallaConf('La clave cambió. Ingresa la nueva.');return}
    $('main').innerHTML='<div class="vacio"><strong>Sin conexión</strong>'+esc(e.message)+'<br><br><button class="sec" onclick="cargar()">Reintentar</button></div>'})
}
function ver(v){vista=v;['hoy','pag','ale','nue'].forEach(function(x){$('n-'+x).className=x===v?'on':''});pintaTitulo();pintar()}
function tag(t){if(!t)return'';var c=/Agotado|Vencido/.test(t)?'t-r':(t==='OK'||t==='Vigente')?'t-ok':'t-w';return '<span class="tag '+c+'">'+esc(t)+'</span>'}
function num(x){return x!==''&&x!==null&&!isNaN(x)}
function presenciales(){return D.clientes.filter(function(c){return c.estado==='Activo'&&!/Online/i.test(c.modalidad)})}
function pintar(){
  if(!D||!$('main'))return;
  var n=D.alertas.length;$('nb').innerHTML=n?'<span class="badge">'+n+'</span>':'';
  var h='';
  if(vista==='hoy'){
    var ps=presenciales(),base=ps.filter(function(c){return (c.toca&&!c.movidaA)||c.hoy}),hechos=base.filter(function(c){return c.hoy}).length;
    $('res').textContent=base.length?hechos+' de '+base.length+' registrados':'';
    if(D.diaLibre)h+='<div class="libre">Sin clases este día · '+esc(D.diaLibre)+'<button onclick="quitarLibre()">Quitar (sí hubo clases)</button></div>';
    var toca=ps.filter(function(c){return c.toca}),otros=ps.filter(function(c){return !c.toca});
    toca.sort(function(x,y){return String(x.hora||'99').localeCompare(String(y.hora||'99'))});
    var fila=function(c){
      var q=num(c.restantes)?'<span class="q'+(c.restantes<=2?' poco':'')+'">Quedan '+c.restantes+'</span>':'Sin pago registrado';
      var x='<div class="cli"><button class="nmb" onclick="ficha(\''+c.id+'\')"><div class="nm">'+(c.toca&&c.hora?'<span class="hora">'+esc(c.hora)+'</span>':'')+esc(c.nombre)+'</div></button><div class="sub">'+q+(c.bloque?', semana '+esc(c.semana)+' de su bloque':'')+(c.vieneDe?' · <span class="q">Cambiada desde el '+fcorta(c.vieneDe)+'</span>':'')+'</div>';
      if(c.hoy){var ok=c.hoy.indexOf('Asistió')===0;x+='<div class="hecho'+(ok?'':' no')+'"><span>'+(ok?'✓ ':'')+esc(c.hoy+memo(c))+'</span><button onclick="deshacer(\''+c.id+'\')">Deshacer</button></div>'}
      else if(c.movidaA)x+='<div class="hecho mov"><span>↪ Movida al '+fcorta(c.movidaA)+(c.movidaHora?' · '+esc(c.movidaHora):'')+'</span><button onclick="quitarMover(\''+c.id+'\')">Deshacer</button></div>';
      else if(!D.diaLibre)x+='<div class="acc"><button class="vino" onclick="vino(\''+c.id+'\')">Vino</button><button class="avi" onclick="aviso(\''+c.id+'\')">Avisó</button><button class="fal" onclick="falto(\''+c.id+'\')">Faltó</button></div>'+(c.toca&&!c.vieneDe?'<button class="lnk" onclick="cambiarDia(\''+c.id+'\')">Cambiar de día</button>':'');
      return x+'</div>'};
    if(toca.length){h+='<div class="grp">Les toca hoy</div>';toca.forEach(function(c){h+=fila(c)})}
    if(otros.length){h+='<div class="grp">'+(toca.length?'Otros clientes':'Clientes')+'</div>';otros.forEach(function(c){h+=fila(c)})}
    if(!ps.length)h='<div class="vacio"><strong>Sin clientes presenciales activos</strong></div>'}
  if(vista==='pag'){$('res').textContent='Toca un cliente para registrar su pago';
    D.pagadores.forEach(function(p){h+='<button class="pg" onclick="pago(\''+p.id+'\')"><div><div class="nm">'+esc(p.nombre)+'</div><div class="sub">'+(num(p.restantes)?'Quedan '+p.restantes+' sesiones':'Plan online')+(p.vence?', referencia '+esc(p.vence):'')+'</div>'+tag(p.pago)+'</div><span class="mas">+</span></button>'})}
  if(vista==='ale'){$('res').textContent=n?n+(n===1?' cliente':' clientes'):'';
    if(!n)h='<div class="vacio"><strong>Todo al día</strong>No hay renovaciones, cierres ni ausencias pendientes.</div>';
    else D.alertas.forEach(function(a){
      var b='';
      if(/plazo/.test(a.texto))b+='<button class="pri" onclick="extender(\''+a.pagador+'\',7)">Extender 1 semana</button><button onclick="extender(\''+a.pagador+'\',14)">2 semanas</button>';
      if(/Agotado|Por agotar|Vencido|Por vencer|Sin registro/.test(a.texto))b+='<button'+(b?'':' class="pri"')+' onclick="pago(\''+a.pagador+'\')">Registrar pago</button>';
      if(/Bloque/.test(a.texto))b+='<button onclick="nuevoMeso(\''+a.id+'\')">Nuevo MESO</button>';
      b+='<button onclick="ficha(\''+a.id+'\')">Ver ficha</button>';
      h+='<div class="cli"><div class="nm">'+esc(a.nombre)+'</div>'+a.texto.split(' · ').map(tag).join('')+'<div class="acts">'+b+'</div></div>'});
    var pausa=D.clientes.filter(function(c){return c.estado==='Pausa'});
    if(pausa.length){h+='<div class="grp">En pausa</div>';pausa.forEach(function(c){h+='<div class="cli"><button class="nmb" onclick="ficha(\''+c.id+'\')"><div class="nm">'+esc(c.nombre)+'</div></button><div class="acts"><button onclick="estado(\''+c.id+'\',\'Activo\')">Reactivar</button></div></div>'})}
    h+='<div style="text-align:center;margin:22px 0 8px"><a class="lnk" href="'+esc(D.planilla)+'" target="_blank" rel="noopener">Abrir planilla completa</a></div>'}
  if(vista==='nue'){$('res').textContent='';$('main').innerHTML='';pintaNuevo();return}
  $('main').innerHTML=h;
}
/* Si el pago tiene un ajuste negativo (sesiones hechas antes de partir el sistema), se cuentan como usadas del plan completo */
function sesTxt(c){if(!num(c.periodo))return '';var u=Number(c.usadas)||0,t=c.periodo,m=/-(\d+)$/.exec(c.plan||''),tp=m?Number(m[1]):0;
  if(tp>t){u+=tp-t;t=tp}
  return u+' de '+t+' usadas · quedan '+c.restantes}
function cli(id){return D.clientes.filter(function(c){return c.id===id})[0]}
function abrir(html){$('panel').innerHTML=html;$('capa').className='capa on'}
function cerrar(){$('capa').className='capa'}
var pmin=0,ptipo='tarde';
function vino(id){rpe=null;parcial=false;pmin=0;ptipo='tarde';var c=cli(id),b='',m='';for(var i=1;i<=10;i++)b+='<button onclick="selR(this,'+i+')">'+i+'</button>';
  [5,10,15,20,25,30,40,45].forEach(function(x){m+='<button onclick="selMin(this,'+x+')">'+x+'</button>'});
  abrir('<h3>'+esc(c.nombre)+'</h3><p>¿Qué tan dura fue la sesión? Opcional.</p><div class="rpe">'+b+'</div><label class="check"><input type="checkbox" onchange="parcial=this.checked;$(\'pbox\').style.display=parcial?\'block\':\'none\'"> Llegó tarde o se fue antes</label>'+
  '<div id="pbox" style="display:none"><div class="seg"><button class="on" onclick="selT(this,\'tarde\')">Llegó tarde</button><button onclick="selT(this,\'antes\')">Se fue antes</button></div><p style="margin:10px 0 0">¿Cuántos minutos?</p><div class="rpe mins" id="pmins" style="grid-template-columns:repeat(4,1fr)">'+m+'</div><input id="potro" type="number" inputmode="numeric" min="1" max="59" placeholder="Otro (minutos)" oninput="otroM(this)" style="margin-bottom:14px"></div>'+
  '<button class="big" onclick="guardaVino(\''+id+'\')">Guardar asistencia</button><button class="sec" onclick="cerrar()">Cancelar</button>')}
function selT(b,t){ptipo=t;Array.prototype.forEach.call(b.parentNode.children,function(x){x.className=''});b.className='on'}
function selMin(b,x){pmin=x;$('potro').value='';Array.prototype.forEach.call(b.parentNode.children,function(y){y.className=''});b.className='on'}
function otroM(i){pmin=Math.round(Number(i.value)||0);Array.prototype.forEach.call($('pmins').children,function(y){y.className=''})}
function guardaVino(id){if(!parcial){enviar(id,'Asistió',rpe);return}
  if(!(pmin>=1&&pmin<=59)){toast('Elige cuántos minutos (1 a 59)',3000);return}
  enviar(id,'Asistió parcial',rpe,{min:pmin,tipo:ptipo})}
var DS=['dom','lun','mar','mié','jue','vie','sáb'];
function fcorta(s){var p=String(s).split('-');if(p.length<3)return esc(s);var d=new Date(+p[0],+p[1]-1,+p[2]);return DS[d.getDay()]+' '+p[2]+'/'+p[1]}
function cambiarDia(id){var c=cli(id);
  abrir('<h3>Cambiar de día</h3><p>'+esc(c.nombre)+' · la sesión del '+fcorta(iso(fecha))+' pasa a:</p><div class="dos"><div><label>Nuevo día</label><input id="mvf" type="date"></div><div><label>Hora</label><input id="mvh" type="time" value="'+esc(/^\d{1,2}:\d{2}$/.test(c.hora||'')?('0'+c.hora).slice(-5):'')+'"></div></div><p style="margin-top:12px">No descuenta sesión ni usa fallos. Ese día aparecerá en "Les toca hoy" y ahí marcas si vino.</p><button class="big" onclick="guardaMover(\''+id+'\')">Guardar cambio</button><button class="sec" onclick="cerrar()">Cancelar</button>')}
function guardaMover(id){var f=$('mvf').value,h=$('mvh').value;if(!f){toast('Elige el nuevo día',3000);return}
  if(f===iso(fecha)){toast('Elige un día distinto',3000);return}
  cerrar();var c=cli(id);c.movidaA=f;c.movidaHora=h;pintar();toast('Guardando…',8000);
  api({a:'mover',id:id,fecha:iso(fecha),nueva:f,hora:h}).then(function(){toast('Cambio guardado');setTimeout(cargar,1500)})
  .catch(function(e){c.movidaA='';pintar();toast('No se guardó: '+e.message,4000)})}
function quitarMover(id){toast('Deshaciendo…',8000);api({a:'quitarMover',id:id,fecha:iso(fecha)}).then(function(){var c=cli(id);c.movidaA='';pintar();toast('Deshecho');setTimeout(cargar,1500)})
  .catch(function(e){toast(e.message,4000)})}
function selR(b,i){rpe=i;Array.prototype.forEach.call(b.parentNode.children,function(x){x.className=''});b.className='on'}
function aviso(id){var c=cli(id);abrir('<h3>'+esc(c.nombre)+' avisó</h3><p>¿Con cuánta anticipación?</p><button class="big" onclick="enviar(\''+id+'\',\'Canceló con aviso ≥8 h\')">Con 8 horas o más</button><button class="sec" onclick="enviar(\''+id+'\',\'Canceló con menos de 8 h\')">Con menos de 8 horas</button><button class="sec" onclick="cerrar()">Cancelar</button>')}
function falto(id){var c=cli(id);abrir('<h3>'+esc(c.nombre)+' no vino</h3><p>No avisó. La sesión se descuenta de su plan.</p><button class="big" onclick="enviar(\''+id+'\',\'No asistió sin aviso\')">Registrar falta</button><button class="sec" onclick="cerrar()">Cancelar</button>')}
function memos(){try{return JSON.parse(localStorage.getItem('inmov_min')||'{}')}catch(e){return {}}}
function memoSet(id,t){try{var m=memos(),k=id+'|'+iso(fecha);if(t)m[k]=t;else delete m[k];localStorage.setItem('inmov_min',JSON.stringify(m))}catch(e){}}
function memo(c){if(c.hoy!=='Asistió parcial')return '';var t=memos()[c.id+'|'+iso(fecha)];return t?' · '+t:''}
function enviar(id,estado,r,ex){cerrar();var c=cli(id);c.hoy=estado;memoSet(id,ex?ex.min+' min '+(ex.tipo==='tarde'?'tarde':'antes'):'');pintar();toast('Guardando…',8000);
  api({a:'sesion',id:id,estado:estado+(ex?'|'+ex.tipo+'|'+ex.min:''),rpe:r,fecha:iso(fecha)}).then(function(){toast('Guardado');setTimeout(cargar,2500)})
  .catch(function(e){c.hoy='';pintar();toast('No se guardó: '+e.message,4000)})}
function deshacer(id){toast('Deshaciendo…',8000);api({a:'deshacer',id:id,fecha:iso(fecha)}).then(function(){cli(id).hoy='';pintar();toast('Deshecho');setTimeout(cargar,2500)})
  .catch(function(e){toast(e.message,4000)})}
function pagoForm(p){var pid=p.id;cerrar();met='Transferencia';
  var op=D.planes.map(function(pl){return '<option value="'+esc(pl.id)+'"'+(pl.id===p.plan?' selected':'')+'>'+esc(pl.nombre)+'</option>'}).join('');
  var pr=(D.planes.filter(function(x){return x.id===p.plan})[0]||{}).precio;var hoy=iso(new Date());
  abrir('<h3>Pago de '+esc(p.nombre)+'</h3><p>Revisa y confirma.</p><label for="pp">Plan</label><select id="pp" onchange="cambiaPlan()">'+op+'</select>'+
  '<label for="pm">Monto</label><input id="pm" type="number" inputmode="numeric" value="'+(pr===''||pr==null?'':pr)+'">'+
  '<label>Método</label><div class="opts"><button class="opt on" onclick="selM(this,\'Transferencia\')">Transferencia</button><button class="opt" onclick="selM(this,\'Efectivo\')">Efectivo</button><button class="opt" onclick="selM(this,\'Otro\')">Otro</button></div>'+
  '<label for="pf">Fecha del pago</label><input id="pf" type="date" value="'+hoy+'">'+
  '<label for="pi">Primera sesión de este plan</label><input id="pi" type="date" value="'+hoy+'">'+
  '<button class="big" onclick="guardaPago(\''+pid+'\')">Registrar pago</button><button class="sec" onclick="cerrar()">Cancelar</button>')}
function cambiaPlan(){var id=$('pp').value,pl=D.planes.filter(function(x){return x.id===id})[0];$('pm').value=pl&&pl.precio!==''?pl.precio:''}
function selM(b,m){met=m;Array.prototype.forEach.call(b.parentNode.children,function(x){x.className='opt'});b.className='opt on'}
function guardaPago(pid){var pl=$('pp').value,mo=$('pm').value,f=$('pf').value,i=$('pi').value;
  if(!mo||!f||!i){toast('Completa el monto y las fechas');return}
  cerrar();toast('Registrando pago…',8000);
  api({a:'pago',pagador:pid,plan:pl,monto:mo,metodo:met,fechaPago:f,inicio:i}).then(function(){toast('Pago registrado');setTimeout(cargar,3000)})
  .catch(function(e){toast('No se registró: '+e.message,4000)})}

var NV=null,OPC=null,per=0;
function nvVacio(){return{tipo:'individual',fecha:iso(new Date()),modalidad:'Presencial',plan:'',horario:'',personas:[{},{}]}}
function nvGuardar(){try{localStorage.setItem('inmov_nuevo',JSON.stringify(NV))}catch(e){}}
function nvCargar(){try{NV=JSON.parse(localStorage.getItem('inmov_nuevo'))}catch(e){}if(!NV||!NV.personas)NV=nvVacio()}
function campo(path,label,ph,tipo){var v=leer(path);var id='f_'+path.replace(/\./g,'_');
  if(tipo==='area')return '<label for="'+id+'">'+label+'</label><textarea id="'+id+'" placeholder="'+esc(ph||'')+'" oninput="esc2(\''+path+'\',this.value)">'+esc(v)+'</textarea>';
  return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(tipo||'text')+'"'+(tipo==='decimal'?' inputmode="decimal"':'')+' placeholder="'+esc(ph||'')+'" value="'+esc(v)+'" oninput="esc2(\''+path+'\',this.value)">'}
function leer(path){var o=NV;path.split('.').forEach(function(k){o=o==null?'':o[k]});return o==null?'':o}
function esc2(path,v){var ks=path.split('.'),o=NV;for(var i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v;nvGuardar();if(/antro\.(peso|estatura)|nac/.test(path))calcs()}
function edadDe(n){if(!n)return'';var h=new Date(),d=new Date(n+'T12:00:00'),e=h.getFullYear()-d.getFullYear();if(h.getMonth()<d.getMonth()||(h.getMonth()===d.getMonth()&&h.getDate()<d.getDate()))e--;return e}
function calcs(){var p=NV.personas[per]||{},a=p.antro||{},e=$('calc_edad'),i=$('calc_imc');
  if(e)e.innerHTML=p.nac?'Edad: <b>'+edadDe(p.nac)+' años</b>':'';
  var est=parseFloat(String(a.estatura||'').replace(',','.')),pe=parseFloat(String(a.peso||'').replace(',','.'));if(est>3)est=est/100;
  if(i)i.innerHTML=(est>0&&pe>0)?'IMC: <b>'+(Math.round(pe/(est*est)*10)/10).toString().replace('.',',')+'</b>':''}
function pintaNuevo(){
  if(!NV)nvCargar();
  if(!OPC){$('main').innerHTML='<div class="carga">Cargando…</div>';api({a:'opciones'}).then(function(o){OPC=o;pintaNuevo()}).catch(function(e){$('main').innerHTML='<div class="vacio"><strong>Sin conexión</strong>'+esc(e.message)+'</div>'});return}
  var duo=NV.tipo==='duo';if(!duo)per=0;var b='p'+per,P='personas.'+per;
  var h='<div class="seg"><button class="'+(!duo?'on':'')+'" onclick="NV.tipo=\'individual\';nvGuardar();pintaNuevo()">Individual</button><button class="'+(duo?'on':'')+'" onclick="NV.tipo=\'duo\';nvGuardar();pintaNuevo()">Dúo</button></div>';
  h+='<details class="sec2" open><summary>Plan</summary><div class="cnt">'+
   '<label>Modalidad</label><div class="opts" style="grid-template-columns:1fr 1fr"><button class="opt'+(NV.modalidad!=='Online'?' on':'')+'" onclick="NV.modalidad=\'Presencial\';nvGuardar();pintaNuevo()">Presencial</button><button class="opt'+(NV.modalidad==='Online'?' on':'')+'" onclick="NV.modalidad=\'Online\';nvGuardar();pintaNuevo()">Online</button></div>'+
   '<label for="f_plan">Plan</label><select id="f_plan" onchange="esc2(\'plan\',this.value)"><option value="">Elegir…</option>'+(D?D.planes:[]).map(function(p){return '<option value="'+esc(p.id)+'"'+(NV.plan===p.id?' selected':'')+'>'+esc(p.nombre)+'</option>'}).join('')+'</select>'+
   campo('horario','Días y horarios','Lu-Mi-Vi 11:00')+campo('fecha','Fecha de la evaluación','','date')+'</div></details>';
  if(duo)h+='<div class="seg" style="margin-top:14px"><button class="'+(per===0?'on':'')+'" onclick="per=0;pintaNuevo()">'+esc(leer('personas.0.nombre')||'Persona 1')+'</button><button class="'+(per===1?'on':'')+'" onclick="per=1;pintaNuevo()">'+esc(leer('personas.1.nombre')||'Persona 2')+'</button></div>';
  var sx=leer(P+'.sexo');
  h+='<details class="sec2" open><summary>Datos personales</summary><div class="cnt"><div class="dos"><div>'+campo(P+'.nombre','Nombre')+'</div><div>'+campo(P+'.apellido','Apellido')+'</div></div>'+
   campo(P+'.nac','Fecha de nacimiento','','date')+'<div class="calc" id="calc_edad"></div>'+
   '<label>Sexo</label><div class="opts">'+['F','M','Otro'].map(function(x){return '<button class="opt'+(sx===x?' on':'')+'" onclick="esc2(\''+P+'.sexo\',\''+x+'\');pintaNuevo()">'+x+'</button>'}).join('')+'</div>'+
   '<div class="dos"><div>'+campo(P+'.telefono','Teléfono','+569…','tel')+'</div><div>'+campo(P+'.email','Correo','','email')+'</div></div></div></details>';
  var ob=leer(P+'.objetivo');
  h+='<details class="sec2"><summary>Objetivos e historial</summary><div class="cnt"><label for="f_obj">Objetivo principal</label><select id="f_obj" onchange="esc2(\''+P+'.objetivo\',this.value)"><option value="">Elegir…</option>'+OPC.objetivos.map(function(o){return '<option'+(ob===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+
   campo(P+'.objetivosTxt','Objetivos (en sus palabras)','','area')+campo(P+'.historial','Historial deportivo / entrenamiento','','area')+'</div></details>';
  h+='<details class="sec2"><summary>Salud</summary><div class="cnt">'+campo(P+'.lesiones','Lesiones','','area')+campo(P+'.enfermedades','Enfermedades metabólicas','','area')+campo(P+'.notas','Medicamentos y otras notas','','area')+'<p class="nota">Las lesiones y enfermedades quedan también en 08_SALUD.</p></div></details>';
  EV.forEach(function(g){h+='<details class="sec2"><summary>'+g[0]+'</summary><div class="cnt">'+g[1].map(function(c){return campo(P+'.eval.'+c[0],c[1],'Observaciones, cargas, reps…')}).join('')+'</div></details>'});
  h+='<details class="sec2"><summary>Composición corporal</summary><div class="cnt"><div class="dos">'+AN.map(function(c){return '<div>'+campo(P+'.antro.'+c[0],c[1],c[2],'decimal')+'</div>'}).join('')+'</div><div class="calc" id="calc_imc"></div></div></details>';
  h+='<button class="big" style="margin-top:18px" onclick="crearNuevo()">Crear '+(duo?'dúo':'cliente')+'</button><button class="sec" onclick="if(confirm(\'¿Borrar todo lo escrito?\')){NV=nvVacio();nvGuardar();per=0;pintaNuevo()}">Empezar de nuevo</button>'+
   '<p class="nota">Lo que escribes se guarda en el teléfono mientras completas la ficha.</p>';
  $('main').innerHTML=h;calcs();

function crearNuevo(){
  var duo=NV.tipo==='duo',ps=duo?NV.personas.slice(0,2):[NV.personas[0]];
  for(var i=0;i<ps.length;i++){if(!ps[i]||!ps[i].nombre||!ps[i].apellido){toast('Falta nombre y apellido'+(duo?' de '+(i?'la persona 2':'la persona 1'):''),3000);return}}
  if(!NV.plan){toast('Elige el plan',3000);return}
  var nom=ps.map(function(p){return p.nombre+' '+p.apellido}).join(' y ');
  if(!confirm('Crear '+(duo?'el dúo ':'a ')+nom+'?\nSe creará su carpeta en Drive con la información y los datos antropométricos.'))return;
  $('main').innerHTML='<div class="carga">Creando carpeta y archivos…<br>Puede tardar unos 30 segundos.</div>';
  var datos=JSON.parse(JSON.stringify(NV));datos.personas=ps;
  api({a:'nuevo',datos:datos}).then(function(r){
    NV=nvVacio();nvGuardar();per=0;
    $('main').innerHTML='<div class="ok-box"><strong>'+esc(r.nombre)+' quedó creado</strong><br>'+r.ids.join(', ')+(r.grupo?' · '+r.grupo:'')+'<br><br><a href="'+esc(r.carpeta)+'" target="_blank" rel="noopener">Abrir carpeta en Drive</a></div>'+
     '<p class="nota">Ya aparece en Sesiones y Pagos. Falta registrar su primer pago y crear su MESO.</p><button class="sec" onclick="pintaNuevo()">Nueva anamnesis</button>';
    cargarSilencioso()})
  .catch(function(e){toast('No se creó: '+e.message,5000);pintaNuevo()})}
function cargarSilencioso(){var f0=iso(fecha);api({a:'datos',fecha:f0}).then(function(d){if(f0!==iso(fecha))return;D=d;var n=D.alertas.length;$('nb').innerHTML=n?'<span class="badge">'+n+'</span>':''}).catch(function(){})}

    if(!l.length)h+='<p style="color:var(--r)">No encontré planillas nuevas en su carpeta. Crea el MESO en su carpeta de Drive y vuelve a intentarlo.</p>';
    l.forEach(function(x,i){h+='<button class="cand'+(i===0?' on':'')+'" data-u="'+esc(x.url)+'" onclick="selMeso(this)">'+esc(x.nombre)+'<small>Creado el '+esc(x.fecha)+'</small></button>'});
    if(l.length)mesoSel=l[0].url;
    h+='<label>¿Cuántas semanas durará?</label><div class="rpe" style="grid-template-columns:repeat(4,1fr)">'+[4,5,6,8].map(function(n){return '<button'+(n===5?' class="on"':'')+' onclick="selSem(this,'+n+')">'+n+'</button>'}).join('')+'</div>'+
      '<label for="mi">Primer día del nuevo MESO</label><input id="mi" type="date" value="'+iso(new Date())+'">'+
      (l.length?'<button class="big" onclick="guardaMeso(\''+id+'\')">Abrir nuevo bloque</button>':'')+'<button class="sec" onclick="cerrar()">Cancelar</button>'+
      '<p class="nota">El bloque actual se cierra el día anterior y el nuevo copia su objetivo, split, frecuencia y RIR.</p>';
    semSel=5;abrir(h)}).catch(function(x){toast(x.message,4000);cerrar()})}
function selSem(b,n){semSel=n;Array.prototype.forEach.call(b.parentNode.children,function(x){x.className=''});b.className='on'}
function selMeso(b){mesoSel=b.getAttribute('data-u');Array.prototype.forEach.call(document.querySelectorAll('.cand'),function(x){x.className='cand'});b.className='cand on'}
function guardaMeso(id){var i=$('mi').value;if(!mesoSel||!i){toast('Elige el archivo y la fecha');return}cerrar();toast('Abriendo bloque…',8000);
  api({a:'nuevoMeso',id:id,url:mesoSel,semanas:semSel,inicio:i}).then(function(){toast('Nuevo bloque abierto ✓',3000);setTimeout(cargar,2500)}).catch(function(x){toast(x.message,4000)})}

document.addEventListener('visibilitychange',function(){if(!document.hidden&&CFG.k&&$('main')&&vista!=='nue'){fecha=new Date();pintaTitulo();cargar()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
if(CFG.u&&CFG.k)iniciar();else pantallaConf();
</script>
